[build]
builder = "dockerfile"

[deploy]
# Migrate in start (same container as app). preDeploy uses an ephemeral container;
# with SQLite the DB file from migrate is discarded before gunicorn starts.
# sh -c expands $PORT (Dockerfile exec form does not).
startCommand = "sh -c \"python manage.py migrate --noinput && python manage.py ensure_app_user && python manage.py seed_demo_data && exec gunicorn fichas_vet.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120\""
healthcheckPath = "/health/"
healthcheckTimeout = 180
restartPolicyType = "on_failure"
