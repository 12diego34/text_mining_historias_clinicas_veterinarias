<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fichas Veterinarias{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f0; color: #1a1a1a; font-size: 14px; }
    a { color: #2d6a4f; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* NAV */
    nav { background: #1b4332; color: #fff; padding: .75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    nav .brand { font-size: 16px; font-weight: 600; color: #fff; }
    nav a { color: #a8d5ba; font-size: 13px; }
    nav a:hover { color: #fff; text-decoration: none; }
    nav .spacer { flex: 1; }

    /* LAYOUT */
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.25rem; }

    /* CARDS */
    .card { background: #fff; border-radius: 10px; border: 1px solid #e2e8e0; padding: 1.25rem; margin-bottom: 1rem; }
    .card-title { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1rem; }

    /* STAT CARDS */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.25rem; }
    .stat { background: #fff; border: 1px solid #e2e8e0; border-radius: 8px; padding: 1rem 1.25rem; }
    .stat .num { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat .lbl { font-size: 12px; color: #777; margin-top: 4px; }
    .stat.ok .num  { color: #2d6a4f; }
    .stat.warn .num { color: #b45309; }
    .stat.err .num  { color: #b91c1c; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 7px; border: 1px solid #ccc; background: #fff; font-size: 13px; cursor: pointer; transition: background .15s; text-decoration: none; color: #1a1a1a; }
    .btn:hover { background: #f0f0ec; text-decoration: none; }
    .btn-green { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
    .btn-green:hover { background: #245a42; color: #fff; }
    .btn-red { background: #b91c1c; color: #fff; border-color: #b91c1c; }
    .btn-red:hover { background: #991b1b; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* FORMS */
    input[type=text], input[type=number], input[type=file], select, textarea {
      border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 10px;
      font-size: 13px; width: 100%; background: #fff; color: #1a1a1a;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2d6a4f; }
    label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 3px; }

    /* TABLE */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { background: #f8f8f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #e2e8e0; white-space: nowrap; }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid #f0f0ec; vertical-align: middle; }
    .tbl tr:hover td { background: #fafaf8; }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-pend { background: #fef3c7; color: #92400e; }
    .badge-proc { background: #dbeafe; color: #1e40af; }
    .badge-ok   { background: #d1fae5; color: #065f46; }
    .badge-err  { background: #fee2e2; color: #991b1b; }

    /* MESSAGES */
    .msgs { margin-bottom: 1rem; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
    .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg-error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .msg-info    { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .msg-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    /* GRID FORM */
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; }
    .form-grid .span2 { grid-column: span 2; }
    .form-grid .span4 { grid-column: span 4; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }

    /* PAGINATION */
    .pagination { display: flex; gap: 6px; margin-top: 1rem; align-items: center; }
    .pagination a, .pagination span { padding: 4px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 12px; }
    .pagination .current { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }

    /* SEARCH BAR */
    .search-bar { display: flex; gap: 8px; margin-bottom: 1rem; align-items: center; }
    .search-bar input[type=text] { max-width: 300px; }
    .search-bar select { max-width: 160px; }

    /* SPINNER */
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #d1fae5; border-top-color: #2d6a4f; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DROP ZONE */
    .dropzone { border: 2px dashed #a8d5ba; border-radius: 10px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
    .dropzone:hover, .dropzone.drag-over { border-color: #2d6a4f; background: #f0faf5; }
    .dropzone p { font-size: 13px; color: #555; margin-top: 8px; }
    .dropzone strong { color: #2d6a4f; }
  </style>
</head>
<body>
<nav>
  <span class="brand">🐾 Fichas Veterinarias</span>
  <a href="{% url 'index' %}">Inicio</a>
  <a href="/admin/">Admin</a>
  <span class="spacer"></span>
  <a href="{% url 'exportar_csv' %}?{{ request.GET.urlencode }}">⬇ Exportar CSV</a>
</nav>

<div class="container">
  {% if messages %}
  <div class="msgs">
    {% for msg in messages %}
    <div class="msg msg-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>
</body>
</html>
